<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
<title id="title">Secure Boot versus Measured Boot</title><desc id="desc">Comparación de decisiones y resultados durante el arranque</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#475569"/></marker></defs>
<rect width="1280" height="720" fill="#f8fafc"/>
<text x="640" y="62" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#0f172a">Dos respuestas ante el software de arranque</text>
<!-- connectors behind nodes -->
<path d="M250 190 V270" stroke="#475569" stroke-width="5" fill="none" marker-end="url(#arrow)"/><path d="M250 390 V475" stroke="#475569" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
<path d="M890 190 V270" stroke="#475569" stroke-width="5" fill="none" marker-end="url(#arrow)"/><path d="M890 390 V475" stroke="#475569" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
<rect x="70" y="100" width="360" height="90" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="250" y="145" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#1e3a8a">Secure Boot</text><text x="250" y="174" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#1e3a8a">aplica una política</text>
<rect x="70" y="275" width="360" height="115" rx="16" fill="#fff" stroke="#2563eb" stroke-width="3"/><text x="250" y="320" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#0f172a">Verifica firmas</text><text x="250" y="355" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#334155">¿Está autorizado?</text>
<rect x="70" y="480" width="360" height="130" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="250" y="525" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#166534">Sí: ejecuta</text><text x="250" y="565" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#991b1b">No: bloquea</text>
<rect x="710" y="100" width="360" height="90" rx="16" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/><text x="890" y="145" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#4c1d95">Measured Boot</text><text x="890" y="174" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#4c1d95">registra el estado</text>
<rect x="710" y="275" width="360" height="115" rx="16" fill="#fff" stroke="#7c3aed" stroke-width="3"/><text x="890" y="318" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#0f172a">Extiende PCR</text><text x="890" y="355" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#334155">con hashes del boot</text>
<rect x="710" y="480" width="360" height="130" rx="16" fill="#f3e8ff" stroke="#7c3aed" stroke-width="3"/><text x="890" y="525" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#581c87">El boot puede continuar</text><text x="890" y="562" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#334155">PCR decide si unseal procede</text>
<text x="640" y="675" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#b45309">Medir no equivale a aprobar</text>
</svg>
