<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
<title id="title">Flujo de liberación de llave BitLocker</title><desc id="desc">Desde el reset y las mediciones hasta desbloquear el volumen del sistema operativo</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#475569"/></marker></defs><rect width="1280" height="720" fill="#f8fafc"/>
<text x="640" y="58" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#0f172a">BitLocker: liberar la llave solo al arranque esperado</text>
<!-- connectors behind nodes -->
<path d="M245 220 H300" stroke="#475569" stroke-width="5" fill="none" marker-end="url(#a)"/><path d="M535 220 H590" stroke="#475569" stroke-width="5" fill="none" marker-end="url(#a)"/><path d="M825 220 H880" stroke="#475569" stroke-width="5" fill="none" marker-end="url(#a)"/><path d="M1045 285 V420" stroke="#475569" stroke-width="5" fill="none" marker-end="url(#a)"/><path d="M880 485 H760" stroke="#475569" stroke-width="5" fill="none" marker-end="url(#a)"/><path d="M520 485 H400" stroke="#475569" stroke-width="5" fill="none" marker-end="url(#a)"/>
<rect x="35" y="160" width="210" height="120" rx="16" fill="#e2e8f0" stroke="#64748b" stroke-width="3"/><text x="140" y="208" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#0f172a">1 · Reset</text><text x="140" y="246" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#334155">PCR = estado inicial</text>
<rect x="300" y="160" width="235" height="120" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="417" y="204" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#1e3a8a">2 · Medir boot</text><text x="417" y="242" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#334155">BIOS → loader</text>
<rect x="590" y="160" width="235" height="120" rx="16" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/><text x="707" y="204" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#4c1d95">3 · PCR final</text><text x="707" y="242" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#334155">identidad medida</text>
<rect x="880" y="145" width="330" height="140" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="1045" y="192" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#92400e">4 · TPM_unseal</text><text x="1045" y="230" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#334155">¿PCR coincide con política?</text><text x="1045" y="262" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#334155">No → recuperación</text>
<rect x="880" y="425" width="330" height="120" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="1045" y="469" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#166534">5 · Libera VMK</text><text x="1045" y="508" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#334155">llave del volumen</text>
<rect x="520" y="425" width="240" height="120" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="640" y="469" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#166534">6 · Descifra</text><text x="640" y="508" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#334155">sectores bajo demanda</text>
<rect x="80" y="410" width="320" height="150" rx="16" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/><text x="240" y="455" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#991b1b">7 · Windows protege</text><text x="240" y="494" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#334155">login y control de acceso</text><text x="240" y="528" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#334155">la llave vive en memoria</text>
<text x="640" y="650" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#b45309">TPM habilita el boot; Windows pasa a ser parte de la frontera de confianza</text>
</svg>
