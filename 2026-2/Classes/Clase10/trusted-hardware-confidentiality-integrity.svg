<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
<title id="title">Confidencialidad versus integridad y rollback</title><desc id="desc">BitLocker oculta datos del disco robado, pero no autentica ni garantiza frescura de cada sector</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#475569"/></marker></defs><rect width="1280" height="720" fill="#f8fafc"/>
<text x="640" y="58" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#0f172a">Cifrar no autentica ni demuestra frescura</text>
<!-- connectors behind nodes -->
<path d="M275 220 H480" stroke="#475569" stroke-width="5" fill="none" marker-end="url(#a)"/><path d="M800 220 H1005" stroke="#475569" stroke-width="5" fill="none" marker-end="url(#a)"/><path d="M640 320 V425" stroke="#475569" stroke-width="5" fill="none" marker-end="url(#a)"/>
<rect x="55" y="145" width="220" height="150" rx="18" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/><text x="165" y="194" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#991b1b">Atacante</text><text x="165" y="232" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#334155">lee · modifica</text><text x="165" y="266" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#334155">reemplaza sectores</text>
<rect x="480" y="135" width="320" height="185" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/><text x="640" y="185" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#1e3a8a">Disco cifrado</text><text x="640" y="230" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#334155">ciphertext por sector</text><text x="640" y="273" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#166534">lectura → datos ocultos</text>
<rect x="1005" y="145" width="220" height="150" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="1115" y="195" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#166534">Confidencialidad</text><text x="1115" y="235" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#334155">sin llave, no ve</text><text x="1115" y="268" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#334155">el plaintext</text>
<rect x="185" y="425" width="410" height="175" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="390" y="475" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#92400e">Integridad no garantizada</text><text x="390" y="519" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#334155">cambiar ciphertext corrompe plaintext</text><text x="390" y="558" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#334155">sin MAC por sector</text>
<rect x="685" y="425" width="410" height="175" rx="18" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/><text x="890" y="475" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#991b1b">Frescura no garantizada</text><text x="890" y="519" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#334155">reponer ciphertext antiguo válido</text><text x="890" y="558" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#334155">rollback sin detección</text>
<text x="640" y="665" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#b45309">Resultado: gran mejora para robo de disco, no seguridad completa del estado</text>
</svg>
