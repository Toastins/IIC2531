<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700" role="img" aria-labelledby="title desc">
  <title id="title">Enrollment y boot posterior con TPM seal y unseal</title>
  <desc id="desc">En enrollment se mide un boot confiable y se sella la llave a su PCR esperado. En un boot posterior se calcula el PCR actual y el TPM libera la llave si coincide con la política del blob sellado.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#44546a"/>
    </marker>
    <style>
      .phase { fill:#f6f8fa; stroke:#8a98a8; stroke-width:2; }
      .input { fill:#eaf2ff; stroke:#3e6fa8; stroke-width:2; }
      .process { fill:#fff4d6; stroke:#a87518; stroke-width:2; }
      .state { fill:#eee9ff; stroke:#7057a8; stroke-width:2; }
      .storage { fill:#edf0f2; stroke:#59636e; stroke-width:2; }
      .success { fill:#e6f6eb; stroke:#2d7d46; stroke-width:2; }
      .failure { fill:#fdebea; stroke:#ad3d37; stroke-width:2; }
      .node { rx:12; }
      .line { fill:none; stroke:#44546a; stroke-width:3; marker-end:url(#arrow); }
      .dash { fill:none; stroke:#687788; stroke-width:2.5; stroke-dasharray:8 7; marker-end:url(#arrow); }
      .title { font:700 27px Arial, sans-serif; fill:#17212b; }
      .label { font:700 20px Arial, sans-serif; fill:#17212b; }
      .body { font:17px Arial, sans-serif; fill:#34414d; }
      .small { font:15px Arial, sans-serif; fill:#4b5966; }
      .green { fill:#1e6536; }
      .red { fill:#8f302c; }
    </style>
  </defs>

  <!-- Phase backgrounds -->
  <rect class="phase" x="30" y="25" width="635" height="650" rx="18"/>
  <rect class="phase" x="735" y="25" width="635" height="650" rx="18"/>

  <!-- Connectors: enrollment -->
  <path class="line" d="M200 200 L200 245"/>
  <path class="line" d="M200 320 L200 365"/>
  <path class="line" d="M200 440 L200 490"/>
  <path class="line" d="M440 405 C390 405 355 450 325 510"/>
  <path class="line" d="M325 530 L400 530"/>

  <!-- Connector carrying the sealed blob into the later boot -->
  <path class="dash" d="M620 530 L815 530"/>

  <!-- Connectors: later boot -->
  <path class="line" d="M930 200 L930 245"/>
  <path class="line" d="M930 320 L930 365"/>
  <path class="line" d="M930 440 L930 490"/>
  <path class="line" d="M930 570 L930 600 L850 600 L850 620"/>
  <path class="line" d="M930 570 L930 600 L1190 600 L1190 620"/>

  <!-- Phase labels -->
  <text class="title" x="65" y="70">1. Enrollment: sellar la llave</text>
  <text class="small" x="65" y="98">Al habilitar BitLocker en un boot considerado confiable.</text>

  <text class="title" x="770" y="70">2. Boot posterior: intentar unseal</text>
  <text class="small" x="770" y="98">Las mediciones se repiten antes de abrir el volumen.</text>

  <!-- Enrollment nodes -->
  <rect class="input node" x="70" y="130" width="260" height="70"/>
  <text class="label" x="200" y="160" text-anchor="middle">Boot confiable</text>
  <text class="small" x="200" y="184" text-anchor="middle">firmware → bootloader → kernel</text>

  <rect class="process node" x="70" y="245" width="260" height="75"/>
  <text class="label" x="200" y="276" text-anchor="middle">extend</text>
  <text class="small" x="200" y="300" text-anchor="middle">acumula las mediciones</text>

  <rect class="state node" x="70" y="365" width="260" height="75"/>
  <text class="label" x="200" y="396" text-anchor="middle">PCR esperado</text>
  <text class="small" x="200" y="420" text-anchor="middle">baseline aceptado</text>

  <rect class="input node" x="440" y="365" width="180" height="75"/>
  <text class="label" x="530" y="396" text-anchor="middle">Llave</text>
  <text class="small" x="530" y="420" text-anchor="middle">secreto BitLocker</text>

  <rect class="process node" x="75" y="490" width="250" height="80"/>
  <text class="label" x="200" y="522" text-anchor="middle">seal</text>
  <text class="small" x="200" y="547" text-anchor="middle">sella la llave bajo</text>
  <text class="small" x="200" y="565" text-anchor="middle">la política PCR</text>

  <rect class="storage node" x="400" y="490" width="220" height="80"/>
  <text class="label" x="510" y="522" text-anchor="middle">Blob sellado</text>
  <text class="small" x="510" y="547" text-anchor="middle">llave protegida + política</text>
  <text class="small" x="510" y="565" text-anchor="middle">guardado en el disco</text>

  <!-- Later boot nodes -->
  <rect class="input node" x="800" y="130" width="260" height="70"/>
  <text class="label" x="930" y="160" text-anchor="middle">Boot actual</text>
  <text class="small" x="930" y="184" text-anchor="middle">firmware → bootloader → kernel</text>

  <rect class="process node" x="800" y="245" width="260" height="75"/>
  <text class="label" x="930" y="276" text-anchor="middle">extend</text>
  <text class="small" x="930" y="300" text-anchor="middle">repite las mediciones</text>

  <rect class="state node" x="800" y="365" width="260" height="75"/>
  <text class="label" x="930" y="396" text-anchor="middle">PCR actual</text>
  <text class="small" x="930" y="420" text-anchor="middle">estado de este boot</text>

  <rect class="process node" x="815" y="490" width="230" height="80"/>
  <text class="label" x="930" y="522" text-anchor="middle">TPM verifica</text>
  <text class="small" x="930" y="547" text-anchor="middle">PCR actual contra</text>
  <text class="small" x="930" y="565" text-anchor="middle">la política del blob</text>

  <rect class="success node" x="755" y="620" width="245" height="50"/>
  <text class="label green" x="878" y="652" text-anchor="middle">Coincide → unseal</text>

  <rect class="failure node" x="1055" y="620" width="270" height="50"/>
  <text class="label red" x="1190" y="652" text-anchor="middle">Difiere → recovery</text>
</svg>
